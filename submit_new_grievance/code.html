<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GrievEase - Submit New Grievance</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#c6c5d4",
                    "on-surface-variant": "#454652",
                    "on-primary-fixed": "#000d5f",
                    "surface-bright": "#f8f9fa",
                    "primary-container": "#303f9f",
                    "inverse-primary": "#bbc3ff",
                    "on-secondary-fixed": "#380c00",
                    "on-tertiary": "#ffffff",
                    "surface-container-highest": "#e1e3e4",
                    "tertiary-fixed-dim": "#77dc7a",
                    "on-tertiary-fixed-variant": "#005316",
                    "primary": "#142588",
                    "surface-container-low": "#f3f4f5",
                    "secondary-container": "#fe7e4f",
                    "secondary": "#a43c12",
                    "inverse-surface": "#2e3132",
                    "on-background": "#191c1d",
                    "surface-variant": "#e1e3e4",
                    "primary-fixed-dim": "#bbc3ff",
                    "surface-dim": "#d9dadb",
                    "secondary-fixed": "#ffdbcf",
                    "on-secondary": "#ffffff",
                    "surface-container": "#edeeef",
                    "on-primary-container": "#aab4ff",
                    "on-secondary-fixed-variant": "#822800",
                    "error-container": "#ffdad6",
                    "on-tertiary-container": "#6ace6e",
                    "tertiary-fixed": "#93f993",
                    "outline": "#767683",
                    "on-primary-fixed-variant": "#2d3c9c",
                    "tertiary": "#003c0d",
                    "surface-container-lowest": "#ffffff",
                    "on-error-container": "#93000a",
                    "on-primary": "#ffffff",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#f0f1f2",
                    "on-secondary-container": "#6b1f00",
                    "on-tertiary-fixed": "#002105",
                    "primary-fixed": "#dfe0ff",
                    "surface-container-high": "#e7e8e9",
                    "on-surface": "#191c1d",
                    "error": "#ba1a1a",
                    "surface-tint": "#4755b6",
                    "tertiary-container": "#005617",
                    "surface": "#f8f9fa",
                    "secondary-fixed-dim": "#ffb59c",
                    "background": "#f8f9fa"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "xxl": "1.5rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Manrope"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 0.5px solid rgba(69, 70, 82, 0.1);
        }
        .main-gradient-bg {
            background: radial-gradient(circle at top right, #dfe0ff 0%, #f8f9fa 40%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen pb-32 main-gradient-bg">
<!-- TopAppBar -->
<nav class="fixed top-0 w-full z-50 border-b border-indigo-900/10 bg-slate-50/80 dark:bg-slate-900/80 backdrop-blur-xl flex items-center justify-between px-6 h-16 shadow-[0_8px_24px_rgba(20,37,136,0.06)]">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-indigo-50/50 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-indigo-900" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-indigo-900 font-['Manrope'] font-bold tracking-tight text-lg">New Grievance</h1>
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</nav>
<!-- Main Content Canvas -->
<main class="pt-24 px-6 max-w-md mx-auto space-y-8">
<!-- Header Section -->
<header class="space-y-2">
<div class="inline-flex items-center px-3 py-1 rounded-full bg-primary-fixed text-on-primary-fixed-variant font-label text-[11px] font-bold uppercase tracking-wider">
                Official Submission
            </div>
<h2 class="text-3xl font-headline font-extrabold text-primary tracking-tight">Formalize Your Case</h2>
<p class="text-on-surface-variant font-label text-sm leading-relaxed">Fill in the architectural details of your grievance to initiate the resolution process.</p>
</header>
<!-- Form Section -->
<div class="space-y-6">
<!-- Category & Subcategory Grid -->
<div class="grid grid-cols-1 gap-6">
<!-- Category Dropdown -->
<div class="space-y-2">
<label class="block font-label text-xs font-bold text-primary uppercase tracking-widest px-1">Category</label>
<div class="relative group">
<select class="w-full h-14 pl-4 pr-10 appearance-none bg-surface-container-high border-none rounded-xl text-on-surface font-label focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all duration-300">
<option>Academic</option>
<option>Infrastructure</option>
<option>Administrative</option>
<option>Financial</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-primary">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Subcategory Dropdown -->
<div class="space-y-2">
<label class="block font-label text-xs font-bold text-primary uppercase tracking-widest px-1">Subcategory</label>
<div class="relative group">
<select class="w-full h-14 pl-4 pr-10 appearance-none bg-surface-container-high border-none rounded-xl text-on-surface font-label focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all duration-300">
<option>Select Sub-category</option>
<option>Exam Scheduling</option>
<option>Faculty Conduct</option>
<option>Course Material Access</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-primary">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Title Input -->
<div class="space-y-2">
<label class="block font-label text-xs font-bold text-primary uppercase tracking-widest px-1">Subject Title</label>
<input class="w-full h-14 px-4 bg-surface-container-high border-none rounded-xl text-on-surface font-label placeholder:text-outline focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all duration-300" placeholder="Brief summary of the issue" type="text"/>
</div>
<!-- Description Textarea -->
<div class="space-y-2">
<label class="block font-label text-xs font-bold text-primary uppercase tracking-widest px-1">Detailed Description</label>
<textarea class="w-full p-4 bg-surface-container-high border-none rounded-xl text-on-surface font-label placeholder:text-outline focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all duration-300 resize-none" placeholder="Provide as much context as possible..." rows="5"></textarea>
</div>
<!-- Attachment Area -->
<div class="space-y-2">
<label class="block font-label text-xs font-bold text-primary uppercase tracking-widest px-1">Evidence &amp; Documentation</label>
<div class="relative overflow-hidden glass-card rounded-xxl p-8 border-2 border-dashed border-indigo-900/10 flex flex-col items-center justify-center text-center space-y-3 group hover:border-primary/30 transition-all duration-300 cursor-pointer">
<div class="w-14 h-14 rounded-full bg-primary-fixed flex items-center justify-center text-primary group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'opsz' 32;">upload_file</span>
</div>
<div class="space-y-1">
<p class="font-headline font-bold text-on-surface text-sm">Add Attachments</p>
<p class="font-label text-on-surface-variant text-xs">PDF, JPG, or PNG (Max 10MB)</p>
</div>
</div>
</div>
<!-- Submit Button (Coral) -->
<div class="pt-4">
<button class="w-full h-16 bg-gradient-to-br from-secondary to-secondary-container rounded-xxl text-on-secondary font-headline font-extrabold text-lg shadow-[0_8px_24px_rgba(164,60,18,0.25)] active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                    Submit Complaint
                    <span class="material-symbols-outlined">send</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 border-t border-indigo-900/10 bg-slate-50/80 dark:bg-slate-900/80 backdrop-blur-xl flex justify-around items-center px-4 pb-safe pt-2 shadow-[0_-8px_24px_rgba(20,37,136,0.06)] h-20">
<div class="flex flex-col items-center justify-center text-slate-500 hover:bg-indigo-50 transition-colors px-4 py-1.5 cursor-pointer">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 hover:bg-indigo-50 transition-colors px-4 py-1.5 cursor-pointer">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">History</span>
</div>
<!-- Active Tab: New Grievance (Contextually "Track" or implied active state) -->
<div class="flex flex-col items-center justify-center bg-indigo-100/50 text-indigo-900 rounded-2xl px-4 py-1.5 active:scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined" data-icon="analytics" style="font-variation-settings: 'FILL' 1;">analytics</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Track</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 hover:bg-indigo-50 transition-colors px-4 py-1.5 cursor-pointer">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Profile</span>
</div>
</nav>
<!-- Visual Polish: Background shapes -->
<div class="fixed top-[15%] -right-20 w-64 h-64 bg-secondary/5 blur-[100px] -z-10 rounded-full"></div>
<div class="fixed bottom-[10%] -left-20 w-80 h-80 bg-primary/5 blur-[120px] -z-10 rounded-full"></div>
</body></html>
